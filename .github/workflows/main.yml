name: Run tests

on:
  push:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.name }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python-wrapper
            os: ubuntu-latest
            test-file: tests/contract/test_contract_fastapi.py
          - name: testcontainers
            os: ubuntu-latest
            test-file: tests/contract/test_contract_using_test_container.py
          - name: redis-service
            os: ubuntu-latest
            test-file: tests/redis/test_redis_service.py
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JRE 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          java-package: "jre"

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run pip install
        run: pip install -r requirements.txt

      - name: Save Specmatic license
        shell: python
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        run: |
          import os
          from pathlib import Path

          license_key = os.environ.get("SPECMATIC_LICENSE_KEY", "")
          if license_key:
              license_file = Path.home() / ".specmatic" / "specmatic-license.txt"
              license_file.parent.mkdir(parents=True, exist_ok=True)
              license_file.write_text(license_key, encoding="utf-8")

      - name: Run tests
        run: coverage run --branch -m pytest ${{ matrix.test-file }} -v -s --junitxml contract-test-reports/TEST-${{ matrix.name }}-${{ matrix.os }}.xml

      - name: Publish contract test report
        uses: mikepenz/action-junit-report@v3
        if: always()
        with:
          report_paths: "**/contract-test-reports/TEST-*.xml"
          check_name: Test results (${{ matrix.name }}, ${{ matrix.os }})

      - name: Generate coverage report
        run: coverage html -d coverage-report

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}-${{ matrix.os }}-coverage-report
          path: coverage-report

      - name: Upload HTML Test Report
        if: matrix.name != 'redis-service'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}-${{ matrix.os }}-html-report
          path: build/reports/specmatic/test/html
